[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agente"
version = "1.0.0"
description = "Agente A2A da Central de Salas, host MCP por dentro."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "a2a-sdk[http-server]==1.2.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools]
packages = ["agente_a2a"]
