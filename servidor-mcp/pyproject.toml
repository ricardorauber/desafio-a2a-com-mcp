[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "servidor-mcp"
version = "1.0.0"
description = "Servidor MCP da Central de Salas da Hill Valley Tech."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["servidor_mcp"]
